version: '3.8'

services:
  elasticsearch:
    image: bitnami/elasticsearch:8.17.1
    container_name: elasticsearch
    volumes:
      - elasticsearch_data:/bitnami/elasticsearch
    environment:
      - discovery.type=single-node
      - network.host=0.0.0.0
    ports:
      - "9300:9300"
      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s
    networks:
      - docker-backend

  logstash:
    image: bitnami/logstash:8.17.1
    container_name: logstash
    volumes:
      - logstash_data:/bitnami/logstash
      - ./logstash/pipeline/logstash.conf:/etc/logstash/conf.d/logstash.conf
    command: logstash -f /etc/logstash/conf.d/logstash.conf
    ports:
      - "5000:5000"
    networks:
      - docker-backend

  kibana:
    image: bitnami/kibana:8.17.1
    container_name: kibana
    volumes:
      - kibana_data:/bitnami/kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - docker-backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapido-backend
    ports:
      - "5001:5001"
    depends_on:
      - logstash
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-2c64d766-mgiri2000mgiri-d1cb.l.aivencloud.com:21671/rapido_project?sslMode=REQUIRED&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: avnadmin
      SPRING_DATASOURCE_PASSWORD: AVNS_tenhTP6S2wNg8aZLTMv
      SPRING_REDIS_HOST: gusc1-evolved-cod-31734.upstash.io
      SPRING_REDIS_PORT: 31734
      SPRING_REDIS_PASSWORD: 4ac4dd4be6444445908c6a96593e695a
    networks:
      - docker-backend

volumes:
  elasticsearch_data: {}
  kibana_data: {}
  logstash_data: {}

networks:
  docker-backend:
    driver: bridge
