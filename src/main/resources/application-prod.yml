file:
  upload-dir: /var/uploads  # Production file storage

management:
  endpoints:
    web:
      exposure:
        include: "health,info"  # Limit exposed actuator endpoints

FRONTEND_URL: "https://your-production-site.com"

server:
  port: 5000
